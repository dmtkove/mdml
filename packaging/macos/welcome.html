<body>
<p><b>mdml</b> converts Markdown files to themed HTML.</p>
<ul>
<li>Installs <code>mdml.app</code> in Applications</li>
<li>Puts the <code>mdml</code> command on your PATH</li>
<li>Adds a Finder service: right-click a Markdown file → <b>Convert to HTML</b></li>
</ul>
<p>You can also drop a <code>.md</code> file onto the app.</p>
</body>
