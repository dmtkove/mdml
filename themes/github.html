<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root {
    color-scheme: light;
  }

  body {
    margin: 0;
    background: #fff;
    color: #1f2328;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  }

  .markdown-body {
    box-sizing: border-box;
    max-width: 980px;
    margin: 0 auto;
    padding: 32px 24px 64px;
    font-size: 16px;
    line-height: 1.5;
    word-wrap: break-word;
  }

  .markdown-body > :first-child {
    margin-top: 0;
  }

  .markdown-body a {
    color: #0969da;
    text-decoration: none;
  }

  .markdown-body a:hover {
    text-decoration: underline;
  }

  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3,
  .markdown-body h4,
  .markdown-body h5,
  .markdown-body h6 {
    margin-top: 24px;
    margin-bottom: 16px;
    font-weight: 600;
    line-height: 1.25;
  }

  .markdown-body h1 {
    padding-bottom: 0.3em;
    font-size: 2em;
    border-bottom: 1px solid #d1d9e0;
  }

  .markdown-body h2 {
    padding-bottom: 0.3em;
    font-size: 1.5em;
    border-bottom: 1px solid #d1d9e0;
  }

  .markdown-body h3 { font-size: 1.25em; }
  .markdown-body h4 { font-size: 1em; }

  .markdown-body p,
  .markdown-body blockquote,
  .markdown-body ul,
  .markdown-body ol,
  .markdown-body dl,
  .markdown-body table,
  .markdown-body pre {
    margin-top: 0;
    margin-bottom: 16px;
  }

  .markdown-body hr {
    height: 0.25em;
    padding: 0;
    margin: 24px 0;
    border: 0;
    background-color: #d1d9e0;
  }

  .markdown-body blockquote {
    padding: 0 1em;
    color: #59636e;
    border-left: 0.25em solid #d1d9e0;
  }

  .markdown-body ul,
  .markdown-body ol {
    padding-left: 2em;
  }

  .markdown-body code,
  .markdown-body tt {
    padding: 0.2em 0.4em;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 85%;
    white-space: break-spaces;
    background-color: #818b981f;
    border-radius: 6px;
  }

  .markdown-body pre {
    padding: 16px;
    overflow: auto;
    font-size: 85%;
    line-height: 1.45;
    background-color: #f6f8fa;
    border-radius: 6px;
  }

  .markdown-body pre.mermaid {
    background: transparent;
    text-align: center;
    font-size: 16px;
  }

  .markdown-body pre code {
    padding: 0;
    font-size: 100%;
    white-space: pre;
    background: transparent;
    border-radius: 0;
  }

  .markdown-body table {
    border-spacing: 0;
    border-collapse: collapse;
    display: block;
    width: max-content;
    max-width: 100%;
    overflow: auto;
  }

  .markdown-body table th,
  .markdown-body table td {
    padding: 6px 13px;
    border: 1px solid #d1d9e0;
  }

  .markdown-body table th {
    font-weight: 600;
    background: #f6f8fa;
  }

  .markdown-body table tr:nth-child(2n) {
    background: #f6f8fa;
  }

  .markdown-body img {
    max-width: 100%;
    box-sizing: content-box;
  }

  .markdown-body .task-list-item {
    list-style-type: none;
  }

  .markdown-body .task-list-item input {
    margin: 0 0.4em 0.25em -1.6em;
    vertical-align: middle;
  }

  {{css}}
</style>
</head>
<body>
<article class="markdown-body">
{{content}}
</article>
{{scripts}}
</body>
</html>
