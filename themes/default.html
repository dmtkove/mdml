<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root {
    color-scheme: light;
  }

  body {
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1.25rem 3rem;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1.05rem;
    line-height: 1.65;
    color: #1a1a1a;
    background: #fff;
  }

  main > :first-child {
    margin-top: 0;
  }

  a {
    color: #0b57d0;
  }

  h1, h2, h3, h4, h5, h6 {
    line-height: 1.25;
    margin-top: 1.8em;
  }

  h1 { font-size: 2rem; }
  h2 { font-size: 1.5rem; }
  h3 { font-size: 1.2rem; }

  pre, code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.92em;
  }

  :not(pre) > code {
    padding: 0.15em 0.35em;
    border-radius: 0.3em;
    background: #f2f2f2;
  }

  pre {
    padding: 1rem 1.1rem;
    overflow: auto;
    border-radius: 0.5rem;
    background: #f5f5f5;
  }

  pre.mermaid {
    background: transparent;
    text-align: center;
  }

  pre code {
    padding: 0;
    background: transparent;
  }

  blockquote {
    margin-left: 0;
    padding: 0.1em 1em;
    border-left: 4px solid #d0d0d0;
    color: #444;
  }

  table {
    border-collapse: collapse;
    width: 100%;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 0.45em 0.7em;
    text-align: left;
  }

  th {
    background: #f7f7f7;
  }

  img {
    max-width: 100%;
  }

  hr {
    border: 0;
    border-top: 1px solid #ddd;
  }

  {{css}}
</style>
</head>
<body>
<main>
{{content}}
</main>
{{scripts}}
</body>
</html>
